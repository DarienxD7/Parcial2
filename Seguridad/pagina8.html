<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguridad</title>
    <link rel="stylesheet" href="style_pagina8.css">
</head>
<body>
    <div class="ventana">
        <div class="barra-titulo">SEGURIDAD</div>
        <div class="contenido">
            <h2 class="subtitulo">SEGURIDAD</h2>

            <div class="caja-campos">
                <div class="fila-top">
                    <label>USUARIO:</label>
                    <input type="text" id="inputUsuario" value="admin">
                    <label>CONTRASEÑA ASIGNADA:</label>
                    <input type="password" id="inputContrasena" value="12345">
                </div>

                <div class="fila">
                    <label>NOMBRE COMPLETO:</label>
                    <input type="text" id="inputNombre" value="administrador" class="input-ancho">
                </div>

                <div class="fila">
                    <label>DESCRIPCION:</label>
                    <textarea id="inputDescripcion"></textarea>
                </div>

                <div class="fila fila-radio">
                    <label>TIPO DE<br>USUARIO:</label>
                    <div class="radios">
                        <div><input type="radio" name="tipo" value="Operador"> Operador</div>
                        <div><input type="radio" name="tipo" value="Administrador" checked> Administrador</div>
                    </div>
                </div>
            </div>

            <div class="botones">
                <button>Primero</button>
                <button>Anterior</button>
                <button>Siguiente</button>
                <button>Último</button>
                <button>Nuevo</button>
                <button>Editar</button>
                <button>Guardar</button>
                <button>Deshacer</button>
                <button>Salir</button>
            </div>
        </div>
    </div>

    <script src="script_pagina8.js"></script>
</body>
</html>
