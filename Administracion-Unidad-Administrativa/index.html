<!DOCTYPE html>
<html lang="es">
<head>

    <title>Unit Administration System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-window">
        <div class="system-header">SISTEMA DE ACTIVOS FIJOS</div>
        <div class="unit-bar">Unidad Administrativa</div>

        <div class="gradient-title">
            Administración Unidad Administrativa
        </div>

        <div class="content-container">
            <div class="table-scroll-area">
                <table class="data-grid">
                    <thead>
                        <tr>
                            <th style="width: 20%;">UNIDAD</th>
                            <th style="width: 50%;">DESCRIPCION</th>
                            <th style="width: 30%;">CIUDAD</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="active-row">
                            <td>025</td>
                            <td>GACETA OFICIAL DE BOLIVIA</td>
                            <td>LA PAZ</td>
                        </tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                        <tr><td>&nbsp;</td><td></td><td></td></tr>
                    </tbody>
                </table>
            </div>

            <div class="control-panel">
                <button class="nav-btn">Nuevo</button>
                <button class="nav-btn">Editar</button>
                <button class="nav-btn">Eliminar</button>
                <button class="nav-btn btn-highlight">Seleccionar</button>
                <button class="nav-btn">Salir</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
