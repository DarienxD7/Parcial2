<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Administración de Recursos</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window">

    <div class="topbar">
        ADMINISTRACION DE RECURSOS
    </div>

    <div class="header">
        ADMINISTRACION DE RECURSOS
    </div>

    <div class="content">

        <div class="left-panel">

            <div class="panel-title">
                CIERRE DE GESTION
            </div>

            <button class="btn">Cerrar Gestión</button>
            <button class="btn">Cambiar Gestión</button>

            <div class="space"></div>

            <button class="btn">Importar/Exportar</button>
            <button class="btn">Indices UVF</button>
            <button class="btn">Seguridad</button>
            <button class="btn">Re-indexar</button>
            <button class="btn">Migrador</button>

        </div>

        <div class="right-panel">

            <div class="year-box">
                2013
            </div>

            <textarea class="textarea"></textarea>

        </div>

        <div class="popup">

            <div class="popup-header">
                Microsoft Visual FoxPro
            </div>

            <div class="popup-body">

                <div class="icon">
                    ?
                </div>

                <div class="message">
                    Es usted el unico usuario del sistema
                </div>

            </div>

            <div class="popup-buttons">
                <button class="popup-btn">Sí</button>
                <button class="popup-btn">No</button>
            </div>

        </div>

        <button class="exit-btn">
            Salir
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
